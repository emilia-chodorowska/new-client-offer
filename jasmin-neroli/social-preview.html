<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Social preview — Jaśmin i neroli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#24241f; --ink-2:#33332e; --muted:#69685f;
    --green:#55704a; --green-pill:#eef2ea; --line:#ebe9e4;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Karla','Helvetica Neue',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  body{background:#e8e5de;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:1200px;height:630px;background:#fff;display:grid;grid-template-columns:660px 540px;overflow:hidden}
  .left{padding:64px 56px 60px;display:flex;flex-direction:column;justify-content:center}
  .logo{height:26px;width:auto;margin-bottom:30px}
  .kicker{display:inline-flex;align-self:flex-start;align-items:center;height:32px;padding:0 15px;border-radius:999px;background:var(--green-pill);color:var(--green);font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  h1{margin-top:24px;font-family:var(--serif);font-size:88px;font-weight:400;line-height:1.02;letter-spacing:.005em;color:var(--ink)}
  .lat{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:23px;font-weight:500;color:var(--muted)}
  .lead{margin-top:26px;font-family:var(--sans);font-size:21px;line-height:1.5;color:var(--ink-2);max-width:20em}
  .rule{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .right{position:relative}
  .right img{width:100%;height:100%;object-fit:cover;object-position:center 70%}
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <img class="logo" src="images/doterralogo.png" alt="">
      <span class="kicker">Egipt</span>
      <h1>Jaśmin<br>i neroli</h1>
      <div class="lat">Jasminum grandiflorum · Citrus aurantium</div>
      <p class="lead">Ręczny zbiór przed świtem, kwiat po kwiecie — i pierwsza w historii destylacja jaśminu.</p>
      <div class="rule">Skąd biorą się te olejki</div>
    </div>
    <div class="right"><img src="images/pole-jasminu-swit.jpg" alt=""></div>
  </div>
</body>
</html>
